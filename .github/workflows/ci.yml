name: Vesper Launcher CI

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  test-and-build:
    name: Test & Build (Go + Frontend + Updater)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.24'
          cache: true

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Build Frontend
        run: |
          cd frontend
          npm ci
          npm run build

      - name: Run Go Tests
        run: go test -v -count=1 ./...

      - name: Build Update Tools
        run: |
          mkdir -p bin
          CGO_ENABLED=0 go build -o bin/vesper-update-server ./cmd/vesper-update-server
          CGO_ENABLED=0 go build -o bin/vesper-updater-cli ./cmd/vesper-updater-cli
          CGO_ENABLED=0 go build -o bin/vesper-release-publisher ./cmd/vesper-release-publisher
          ls -lh bin/
